[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satsim"
version = "0.1.0"
description = "Simulador de posicionamento de satélites (ISS e constelação heliossíncrona)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "skyfield",
]

[tool.hatch.build.targets.wheel]
packages = ["src/satsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
