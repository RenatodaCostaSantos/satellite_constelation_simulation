[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satsim"
version = "0.1.0"
description = "Simulador de posicionamento de satélites (ISS e constelação heliossíncrona)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sgp4>=2.23",  # S3-02: oráculo SGP4 (TLE da ISS)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "skyfield",
    "matplotlib",  # só em scripts/ (gráficos dos relatórios)
]

[tool.hatch.build.targets.wheel]
packages = ["src/satsim"]
# Dados do pacote (TLE embarcado em satsim/data/, assets do viewer em satsim/app/static/):
# o hatchling inclui todo arquivo não ignorado dentro de src/satsim; lidos via importlib.resources.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
