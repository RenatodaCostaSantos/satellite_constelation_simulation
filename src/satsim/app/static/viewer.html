<!doctype html>
<!--
  Viewer do satsim (ADR 0001, seção GUI). Python calcula a cena; este viewer só desenha.
  Este arquivo é o modelo: scripts/build_demo.py troca as três tags <script src> e o <link>
  pelo conteúdo embutido e gera demo/index.html, que abre com duplo clique (file://).
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>satsim — simulador de satélites</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<header class="topbar">
  <div class="brand">satsim <span>simulador de satélites</span></div>
  <div class="clock" id="clock" title="Relógio da simulação (UTC)">UTC —</div>
  <div class="controls">
    <button id="btn-play" class="btn btn-play" title="Reproduzir / pausar (barra de espaço)">❚❚</button>
    <div class="speeds" id="speeds" role="group" aria-label="Velocidade"></div>
    <button id="btn-start" class="btn" title="Voltar ao início da janela">⏮ início</button>
  </div>
</header>

<main class="layout">
  <section class="panel globe-panel">
    <div class="panel-title">Globo 3D</div>
    <div id="globe"></div>
    <div class="hint">arraste para girar · roda do mouse para zoom</div>
  </section>
  <section class="side">
    <div class="panel map-panel">
      <div class="panel-title">Mapa 2D — traço no solo</div>
      <div class="map-wrap"><canvas id="map"></canvas></div>
    </div>
    <div class="panel legend-panel">
      <div class="panel-title">Satélites</div>
      <ul id="legend" class="legend"></ul>
      <div class="keys">
        <span><i class="k-solid"></i> passado</span>
        <span><i class="k-dash"></i> futuro</span>
        <span><i class="k-station"></i> estação de solo</span>
      </div>
      <div class="frame-note" id="frame-note"></div>
    </div>
  </section>
</main>

<footer class="timeline">
  <span class="tl-label" id="tl-start"></span>
  <input type="range" id="timeline" min="0" max="1" step="1" value="0" aria-label="Linha do tempo">
  <span class="tl-label" id="tl-end"></span>
</footer>

<div id="error" class="error" hidden></div>

<script src="vendor/globe.gl.min.js"></script>
<script src="scene.js"></script>
<script src="viewer.js"></script>
</body>
</html>
